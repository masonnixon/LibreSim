[project]
name = "libresim-backend"
version = "0.1.0"
description = "LibreSim - Web-based block diagram simulation backend"
authors = [{ name = "LibreSim Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.25.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ============================================================================
# PYTEST CONFIGURATION
# ============================================================================
[tool.pytest.ini_options]
addopts = "-v --strict-markers --strict-config --cov=src --cov-report=term-missing --cov-report=html --cov-report=xml"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

# ============================================================================
# RUFF CONFIGURATION (Linting + Formatting)
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E,F: base errors; I: import sort; B: bugbear; UP: pyupgrade; SIM: simplify
# N: naming conventions - disabled for OSK simulation framework (see comments below)
select = ["E", "F", "I", "B", "UP", "SIM", "W"]
ignore = [
    "E203",   # keeps slicing compatible with Black-style
    "E402",   # module-import-not-at-top - tests organized by section with imports
    "E501",   # line-too-long - many are code templates (C/Rust strings)
    "E712",   # true-false-comparison - explicit bool comparison is clearer in tests
    "B904",   # raise-without-from - FastAPI patterns don't require exception chaining
    "B008",   # function-call-in-default - FastAPI's File(...) pattern
    "SIM102", # collapsible-if - sometimes expanded ifs are clearer
    "SIM103", # needless-bool - explicit returns are clearer
    "SIM108", # if-else-block-instead-of-if-exp - ternary not always clearer
    "SIM118", # in-dict-keys - explicit .keys() can be clearer
    "SIM401", # if-else-block-instead-of-dict-get - explicit if/else sometimes clearer
]
# NOTE: Naming conventions (N) are intentionally NOT enforced because:
# - OSK uses camelCase methods (getOutput, setInput) matching Simulink/MATLAB
# - Engineering variables (Kp, Ki, Kd, A, B, C, D) are universal control notation
# These are intentional design decisions, not code quality issues.
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ============================================================================
# MYPY CONFIGURATION (Type Checking)
# ============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = false
warn_required_dynamic_aliases = false

# Per-module mypy overrides for OSK simulation blocks
# These blocks have intentional None-able types that are checked at runtime
[[tool.mypy.overrides]]
module = [
    "src.osk.blocks.*",
]
# Disable strict Optional checks for simulation blocks that manage their own None handling
strict_optional = false

[[tool.mypy.overrides]]
module = [
    "src.codegen.generator",
]
# Disable assignment type checking for ABC subclass registrations
disable_error_code = ["assignment"]

# ============================================================================
# BANDIT CONFIGURATION (Security Scanning)
# ============================================================================
[tool.bandit]
exclude_dirs = ["tests", "test"]
skips = [
    "B101",  # assert_used - commonly used in tests
    "B311",  # random - simulation noise sources need pseudo-random, not crypto
    "B404",  # import_subprocess - docker compiler legitimately needs subprocess
    "B603",  # subprocess_without_shell - docker compiler uses list args (safe)
    "B607",  # partial_path - docker executable lookup is standard
    "B608",  # hardcoded_sql - false positive on Dockerfile f-strings with FROM
]

# ============================================================================
# COVERAGE CONFIGURATION
# ============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 85
