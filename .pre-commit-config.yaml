# Pre-commit hooks for LibreSim
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# See https://pre-commit.com for more information

repos:
  # ==========================================================================
  # BACKEND (Python) HOOKS
  # ==========================================================================

  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      # Linting with auto-fix
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      # Code formatting
      - id: ruff-format
        name: ruff (format)
        files: ^backend/

  # Bandit - Security vulnerability scanner
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: bandit (security)
        args: [-c, backend/pyproject.toml, -r]
        files: ^backend/src/

  # MyPy - heavier check, only on push, not every commit. Runs inside the
  # backend dev container so it matches CI's Python 3.11 and pinned deps
  # exactly (the host's conda Python drifts version-to-version and can hit
  # mypy/numpy-stub incompatibilities CI never sees).
  - repo: local
    hooks:
      - id: mypy-backend
        name: mypy (backend typecheck)
        entry: bash -c 'docker exec libresimgit-backend-1 python -m mypy src/ --config-file=pyproject.toml || { echo "mypy failed, or backend container is not running (docker compose up -d backend)"; exit 1; }'
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [pre-push]

      # Pytest (with coverage) - runs on the host's conda Python (see repo
      # CLAUDE.md: "I use anaconda python") since test *behavior* isn't
      # Python-version-sensitive the way mypy's stub parsing is, and running
      # on the host avoids leaving root-owned coverage artifacts (htmlcov/,
      # coverage.xml, .pytest_cache/) that the container's root user would
      # otherwise create and the host user then can't overwrite next run.
      - id: pytest-backend
        name: pytest (backend tests + 100% coverage gate)
        entry: bash -c 'cd backend && python -m pytest tests/ -q --tb=short'
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [pre-push]  # Only run on push, not every commit

  # ==========================================================================
  # FRONTEND (TypeScript/JavaScript) HOOKS
  # ==========================================================================

  # These run inside the frontend dev container (docker compose up).
  # If the container isn't running, the hook FAILS rather than silently
  # skipping — a skipped check is a check that didn't happen.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'docker exec libresimgit-frontend-1 npm run lint || { echo "eslint failed, or frontend container is not running (docker compose up -d frontend)"; exit 1; }'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: tsc
        name: tsc (typecheck)
        entry: bash -c 'docker exec libresimgit-frontend-1 npx tsc --noEmit || { echo "tsc failed, or frontend container is not running (docker compose up -d frontend)"; exit 1; }'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: frontend-coverage
        name: vitest (frontend tests + 100% coverage gate)
        entry: bash -c 'docker exec libresimgit-frontend-1 npm run test:coverage || { echo "frontend tests/coverage failed, or frontend container is not running (docker compose up -d frontend)"; exit 1; }'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        stages: [pre-push]  # Full coverage run only on push, not every commit

  # ==========================================================================
  # GENERAL HOOKS
  # ==========================================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Prevent large files from being committed
      - id: check-added-large-files
        args: [--maxkb=1000]
      # Check for files that would conflict on case-insensitive filesystems
      - id: check-case-conflict
      # Check for merge conflict markers
      - id: check-merge-conflict
      # Check YAML syntax
      - id: check-yaml
        args: [--unsafe]
      # Check JSON syntax
      - id: check-json
      # Ensure files end with newline
      - id: end-of-file-fixer
        exclude: ^(.*\.min\.js|.*\.min\.css)$
      # Remove trailing whitespace
      - id: trailing-whitespace
        exclude: ^(.*\.min\.js|.*\.min\.css|.*\.md)$
      # Check for debugger statements in Python
      - id: debug-statements
        files: ^backend/
      # Check Python AST
      - id: check-ast
        files: ^backend/

  # Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: (package-lock\.json|\.secrets\.baseline)$

# Configuration
default_language_version:
  python: python3.11

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
