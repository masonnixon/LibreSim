# GitLab CI/CD Pipeline for LibreSim
# Mirrors the GitHub Actions workflow in .github/workflows/ci.yml

stages:
  - test
  - validate

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

# Cache dependencies between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - .cache/npm
    - frontend/node_modules/

# =============================================================================
# BACKEND TESTS
# =============================================================================

backend-tests:
  stage: test
  image: python:3.11
  before_script:
    - cd backend
    - pip install -e ".[dev]"
  script:
    # Linting
    - ruff check src/ tests/
    # Type checking
    - mypy src/ --config-file=pyproject.toml
    # Security scan
    - bandit -c pyproject.toml -r src/
    # Unit tests
    - pytest tests/ -v --tb=short --cov=src --cov-report=xml
  artifacts:
    when: always
    paths:
      - backend/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

# =============================================================================
# CODEGEN VALIDATION
# =============================================================================

codegen-validation:
  stage: validate
  image: python:3.11
  needs:
    - backend-tests
  before_script:
    - cd backend
    - pip install -e ".[dev]"
    - cd ..
    # Install build tools
    - apt-get update
    - apt-get install -y build-essential
    # Install Rust
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source $HOME/.cargo/env
  script:
    # Regenerate codegen examples
    - python scripts/regenerate_all_examples.py
    # Run validation
    - python scripts/validate_codegen.py
    - cat docs/codegen-validation-report.md
    # Check pass rate (soft check - informational)
    - |
      PASS_RATE=$(grep -oP '\d+\.\d+%' docs/codegen-validation-report.md | head -1)
      echo "Pass rate: $PASS_RATE"
  artifacts:
    when: always
    paths:
      - docs/codegen-validation-report.md

# =============================================================================
# FRONTEND TESTS
# =============================================================================

frontend-tests:
  stage: test
  image: node:20
  before_script:
    - cd frontend
    - npm ci
  script:
    # Linting
    - npm run lint
    # Type checking
    - npx tsc --noEmit
    # Tests (may not exist yet)
    - npm test -- --run || true
