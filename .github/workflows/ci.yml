name: CI

on:
  push:
    branches: [main, master, develop, toolboxes]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Run linting (ruff)
        run: |
          cd backend
          ruff check src/ tests/

      - name: Run type checking (mypy)
        run: |
          cd backend
          mypy src/ --config-file=pyproject.toml

      - name: Run security scan (bandit)
        run: |
          cd backend
          bandit -c pyproject.toml -r src/

      - name: Run unit tests
        run: |
          cd backend
          pytest tests/ -v --tb=short --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  codegen-validation:
    name: Codegen Validation
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate codegen examples
        run: python scripts/regenerate_all_examples.py

      - name: Run codegen validation
        run: |
          python scripts/validate_codegen.py
          cat docs/reports/codegen-validation-report.md

  frontend-tests:
    name: Frontend Tests (TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting (ESLint)
        run: npm run lint

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:coverage

  gui-stack-tests:
    name: GUI Stack Tests (Docker)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run browser-facing API regressions with backend port occupied
        run: |
          timeout 300 python3 -m http.server 9000 --bind 127.0.0.1 >/tmp/libresim-port-occupier.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --silent http://127.0.0.1:9000/ >/dev/null
          docker compose up --build --detach --wait
          python3 scripts/test_gui_stack.py

      - name: Show stack logs on failure
        if: failure()
        run: docker compose logs
